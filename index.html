<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Manager & Calendar</title>
<style>
:root {
    --bg-gradient: linear-gradient(135deg, #667eea, #764ba2);
    --container-bg: #ffffff;
    --text-color: #333333;
    --input-bg: #ffffff;
    --input-border: #dddddd;
    --item-bg: #f8f9fa;
    --pass-bg: #eeeeee;
}
[data-theme="dark"] {
    --bg-gradient: linear-gradient(135deg, #1a1a2e, #16213e);
    --container-bg: #1f2937;
    --text-color: #f3f4f6;
    --input-bg: #374151;
    --input-border: #4b5563;
    --item-bg: #111827;
    --pass-bg: #374151;
}
body { font-family: Arial, sans-serif; background: var(--bg-gradient); color: var(--text-color); padding: 10px; max-width: 900px; margin: auto; min-height: 100vh; transition: 0.3s; }
.container { background: var(--container-bg); padding: 12px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
input, select, textarea, button { width: 100%; padding: 8px; margin: 4px 0; border: 2px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 6px; font-size: 14px; box-sizing: border-box; }
button { background: #4facfe; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
button:hover { opacity: 0.9; }

/* Compact Cards */
.password-item, .folder-item, .event-item { background: var(--item-bg); padding: 8px 10px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #4facfe; display: flex; flex-direction: column; gap: 4px; }
.password-info, .folder-info, .event-info { width: 100%; }
.password-item .pass { font-family: monospace; background: var(--pass-bg); padding: 2px 5px; border-radius: 4px; word-break: break-all; display: inline-block; margin-top: 2px; }
.badge { display: inline-block; padding: 2px 5px; font-size: 10px; color: white; border-radius: 4px; margin-left: 4px; vertical-align: middle; }

/* Inline Action Toolbar for Cards */
.card-actions { display: flex; gap: 4px; width: 100%; border-top: 1px solid var(--input-border); padding-top: 6px; justify-content: flex-end; }
.btn-small { padding: 4px 8px; font-size: 13px; width: auto; border-radius: 4px; }

.hidden { display: none !important; }
#passwordList, #notesList, #foldersList, #eventsList { margin-top: 10px; max-height: 55vh; overflow-y: auto; }
.status { padding: 6px; border-radius: 6px; margin: 6px 0; font-weight: bold; text-align: center; font-size: 13px; }
.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
.top-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.form-panel { background: var(--item-bg); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--input-border); }
.strength-meter { height: 4px; border-radius: 2px; background: #ddd; margin-top: 3px; transition: 0.3s; width: 0%; }
.header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
.modal:not(.hidden) { display: flex; }
.modal-content { background: var(--container-bg); padding: 15px; border-radius: 10px; width: 90%; max-width: 450px; border: 1px solid var(--input-border); max-height: 85vh; overflow-y: auto; }
.cat-row { display: flex; justify-content: space-between; align-items: center; background: var(--item-bg); padding: 6px; margin: 3px 0; border-radius: 4px; }
.note-img { max-width: 80px; max-height: 80px; border-radius: 4px; margin-top: 4px; cursor: pointer; display: block; border: 1px solid var(--input-border); }

/* Calendar Grid Styles */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; margin-top: 8px; }
.cal-header-cell { font-weight: bold; font-size: 12px; padding: 4px 0; }
.cal-cell { background: var(--item-bg); min-height: 55px; border-radius: 4px; padding: 3px; font-size: 12px; cursor: pointer; border: 1px solid var(--input-border); text-align: left; vertical-align: top; display: flex; flex-direction: column; overflow: hidden; }
.cal-cell:hover { border-color: #4facfe; }
.cal-cell.today { border: 2px solid #4facfe; }
.cal-cell-other { opacity: 0.4; }
.cal-event-dot { font-size: 10px; background: #007bff; color: white; border-radius: 3px; padding: 1px 3px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-theme="light">
<div class="container">
<div class="header-actions">
<h3 style="margin:0;">Jamil's Password Manager</h3>
<div style="display:flex; gap:4px;">
<button onclick="openCatModal()" class="btn-small" style="background:#6f42c1;">Categories</button>
<button onclick="toggleTheme()" class="btn-small" style="background:#6c757d;">Theme</button>
</div>
</div>

<div id="unlock">
<p style="font-size:14px; margin:6px 0;">Please enter your master password to continue.</p>
<input type="password" id="masterPass" placeholder="Master Password">
<button onclick="unlock()">Unlock / Setup</button>
<button id="bioBtn" onclick="unlockBiometric()" style="background:#20c997; display:none; margin-top:4px;">Unlock with Biometrics 🛡️</button>
<div id="status"></div>
</div>

<div id="app" class="hidden">
<!-- Main Tab Navigation -->
<div style="display:flex; gap:3px; margin-bottom:10px; flex-wrap:wrap;">
<button onclick="switchTab('passwords')" id="passTabBtn" style="background:#007bff; flex:1; font-size:13px; padding:6px; min-width:80px;">🔑 Passwords</button>
<button onclick="switchTab('notes')" id="notesTabBtn" style="background:#28a745; flex:1; font-size:13px; padding:6px; min-width:80px;">📝 Notes</button>
<button onclick="switchTab('folders')" id="foldersTabBtn" style="background:#6f42c1; flex:1; font-size:13px; padding:6px; min-width:80px;">📁 Folders</button>
<button onclick="switchTab('calendar')" id="calTabBtn" style="background:#fd7e14; flex:1; font-size:13px; padding:6px; min-width:80px;">📅 Calendar</button>
</div>

<!-- Passwords Section -->
<div id="passwordsPanel">
<div class="top-bar">
<input type="text" id="searchInput" placeholder="Search passwords..." oninput="filterPasswords()" style="flex: 2; margin:0;">
<select id="categoryFilter" onchange="filterPasswords()" style="flex: 1; margin:0;"></select>
<button onclick="toggleAddForm()" style="width: auto; white-space: nowrap; background: #28a745; margin:0; padding:8px 12px;">+ Add</button>
</div>

<div style="display:flex; gap:10px; margin-bottom:6px; align-items:center;">
<label style="font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px;">
<input type="checkbox" id="bioToggle" onchange="toggleBiometricSetting(this)"> Enable Biometric Login
</label>
</div>

<div id="formPanel" class="form-panel hidden">
<h4 id="formTitle" style="margin-top:0; margin-bottom:6px;">Add New Password</h4>
<input id="site" placeholder="Site (e.g. google.com)">
<input id="user" placeholder="Username / Email">
<select id="category"></select>
<div style="display:flex; gap:4px;">
<input id="pass" type="password" placeholder="Password" oninput="checkStrength(this.value)" style="margin:0;">
<button type="button" onclick="openGenModal()" style="width:auto; margin:0; background:#17a2b8;" class="btn-small">Gen</button>
</div>
<div class="strength-meter" id="strengthBar"></div>
<div style="display: flex; gap: 8px; margin-top: 8px;">
<button id="saveBtn" onclick="savePassword()">Save</button>
<button onclick="toggleAddForm()" style="background: #6c757d;">Cancel</button>
</div>
</div>

<div id="passwordList"></div>
</div>

<!-- Secure Notes Section -->
<div id="notesPanel" class="hidden">
<div class="top-bar">
<input type="text" id="searchNotesInput" placeholder="Search notes..." oninput="filterNotes()" style="flex: 2; margin:0;">
<button onclick="toggleAddNoteForm()" style="width: auto; white-space: nowrap; background: #28a745; margin:0; padding:8px 12px;">+ New</button>
</div>

<div id="noteFormPanel" class="form-panel hidden">
<h4 id="noteFormTitle" style="margin-top:0; margin-bottom:6px;">Add New Note</h4>
<input id="noteTitle" placeholder="Note Title">
<textarea id="noteContent" placeholder="Write secure note..." rows="3"></textarea>
<div style="margin: 4px 0;">
<label style="font-size:12px; font-weight:bold; display:block; margin-bottom:2px;">Attach Image (Optional):</label>
<input type="file" id="noteImageInput" accept="image/*">
<div id="imagePreviewContainer" style="margin-top:4px;"></div>
</div>
<div style="display: flex; gap: 8px; margin-top: 8px;">
<button id="saveNoteBtn" onclick="saveNote()">Save Note</button>
<button onclick="toggleAddNoteForm()" style="background: #6c757d;">Cancel</button>
</div>
</div>

<div id="notesList"></div>
</div>

<!-- Folders & Files Section -->
<div id="foldersPanel" class="hidden">
<div class="top-bar">
<input type="text" id="searchFoldersInput" placeholder="Search folders..." oninput="filterFolders()" style="flex: 2; margin:0;">
<button onclick="toggleAddFolderForm()" style="width: auto; white-space: nowrap; background: #28a745; margin:0; padding:8px 12px;">+ New</button>
</div>

<div id="folderFormPanel" class="form-panel hidden">
<h4 id="folderFormTitle" style="margin-top:0; margin-bottom:6px;">Add New Folder</h4>
<input id="folderName" placeholder="Folder Name">
<div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
<label style="font-size:13px;">Color:</label>
<input type="color" id="folderColor" value="#fd7e14" style="height:30px; padding:0; cursor:pointer;">
</div>
<textarea id="folderDesc" placeholder="Description (optional)..." rows="2"></textarea>
<div style="margin: 4px 0;">
<label style="font-size:12px; font-weight:bold; display:block; margin-bottom:2px;">Attach Files:</label>
<input type="file" id="folderFileInput" multiple>
<div id="folderFilePreview" style="font-size:11px; color:#28a745; margin-top:2px; font-weight:bold;"></div>
</div>
<div style="display: flex; gap: 8px; margin-top: 8px;">
<button id="saveFolderBtn" onclick="saveFolder()">Save Folder</button>
<button onclick="toggleAddFolderForm()" style="background: #6c757d;">Cancel</button>
</div>
</div>

<div id="foldersList"></div>
</div>

<!-- Calendar Section -->
<div id="calendarPanel" class="hidden">
<div class="top-bar" style="justify-content: space-between;">
<div style="display:flex; gap:4px; align-items:center;">
<button class="btn-small" onclick="calNavigate(-1)">◀ Prev</button>
<h4 id="calTitle" style="margin:0; font-size:15px; min-width:140px; text-align:center;">October 2026</h4>
<button class="btn-small" onclick="calNavigate(1)">Next ▶</button>
</div>
<div style="display:flex; gap:4px;">
<select id="calViewSelect" onchange="changeCalView(this.value)" style="width:auto; margin:0; padding:4px 8px; font-size:12px;">
<option value="month">Month</option>
<option value="week">Week</option>
<option value="day">Day</option>
</select>
<button onclick="openNewEventForm()" style="width: auto; white-space: nowrap; background: #28a745; margin:0; padding:6px 10px; font-size:12px;">+ Event</button>
</div>
</div>

<!-- Custom Chime Audio Configuration Bar -->
<div style="background:var(--item-bg); padding:8px; border-radius:6px; margin-top:6px; border:1px solid var(--input-border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
<div style="font-size:12px;">🔔 <strong>Custom Chime Audio:</strong> <span id="customChimeStatus" style="color:#666;">Using default built-in chime</span></div>
<div style="display:flex; gap:4px;">
<label class="btn-small" style="background:#17a2b8; margin:0; cursor:pointer; font-size:11px; padding:4px 8px; display:inline-flex; align-items:center;">
Upload Audio <input type="file" id="customAudioInput" accept="audio/*" onchange="loadCustomAudio(event)" style="display:none;">
</label>
<button class="btn-small" onclick="testCurrentChime()" style="background:#28a745; font-size:11px; padding:4px 8px;">Test Chime</button>
<button class="btn-small" onclick="clearCustomAudio()" style="background:#dc3545; font-size:11px; padding:4px 8px;" title="Reset to default">Reset</button>
</div>
</div>

<div id="eventFormPanel" class="form-panel hidden">
<h4 id="eventFormTitle" style="margin-top:0; margin-bottom:6px;">Add New Event</h4>
<input id="eventTitle" placeholder="Event Title">
<input type="date" id="eventDate">
<div style="display:flex; gap:8px;">
<div style="flex:1;"><label style="font-size:11px;">Start Time:</label><input type="time" id="eventTime" value="09:00"></div>
<div style="flex:1;"><label style="font-size:11px;">Color:</label><input type="color" id="eventColor" value="#007bff" style="height:32px; padding:0; cursor:pointer;"></div>
</div>
<div style="display:flex; gap:8px; margin-top:4px;">
<div style="flex:1;">
<label style="font-size:11px;">Recurrence:</label>
<select id="eventRecur" style="margin:0; padding:6px; font-size:12px;">
<option value="none">None (One-time)</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
<option value="yearly">Yearly</option>
</select>
</div>
<div style="flex:1;">
<label style="font-size:11px;">Reminder:</label>
<select id="eventReminder" style="margin:0; padding:6px; font-size:12px;" onchange="requestNotificationPermission()">
<option value="none">No Reminder</option>
<option value="0">At time of event</option>
<option value="10">10 mins before</option>
<option value="30">30 mins before</option>
<option value="60">1 hour before</option>
<option value="1440">1 day before</option>
</select>
</div>
</div>
<textarea id="eventDesc" placeholder="Description / Notes (optional)..." rows="2" style="margin-top:6px;"></textarea>
<div style="display: flex; gap: 8px; margin-top: 8px;">
<button id="saveEventBtn" onclick="saveEvent()">Save Event</button>
<button onclick="toggleAddEventForm()" style="background: #6c757d;">Cancel</button>
</div>
</div>

<div id="calendarContainer"></div>
</div>

<!-- Bottom Action Bar with perfectly synchronized button/label sizing -->
<div style="display:flex; gap:6px; margin-top:12px; border-top: 1px solid var(--input-border); padding-top: 12px; flex-wrap: wrap;">
<button onclick="exportEncrypted()" style="background: #e83e8c; flex:1; font-size:13px; padding:8px; margin:0;">Export Encrypted</button>
<button onclick="exportJSON()" style="background: #6f42c1; flex:1; font-size:13px; padding:8px; margin:0;">Export JSON</button>
<button onclick="exportCSV()" style="background: #20c997; flex:1; font-size:13px; padding:8px; margin:0;">Export CSV</button>
<label style="flex:1; background: #e0a800; color:white; padding:8px; border-radius:6px; text-align:center; font-weight:bold; cursor:pointer; font-size:13px; margin:0; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;">
Import <input type="file" accept=".json,.csv,.enc.json" onchange="importData(event)" style="display:none;">
</label>
<button onclick="lock()" style="background: #6c757d; flex:1; font-size:13px; padding:8px; margin:0;">Lock</button>
</div>
</div>
</div>

<!-- Password Generator Modal -->
<div id="genModal" class="modal hidden">
<div class="modal-content">
<h3>Password Generator</h3>
<label style="font-size:13px;">Length: <span id="lenVal">16</span></label>
<input type="range" id="genLen" min="8" max="32" value="16" oninput="document.getElementById('lenVal').textContent=this.value">
<div style="text-align:left; font-size:13px; margin:8px 0;">
<label><input type="checkbox" id="genUpper" checked> Uppercase (A-Z)</label><br>
<label><input type="checkbox" id="genLower" checked> Lowercase (a-z)</label><br>
<label><input type="checkbox" id="genNums" checked> Numbers (0-9)</label><br>
<label><input type="checkbox" id="genSyms" checked> Symbols (!@#$)</label>
</div>
<input type="text" id="genResult" readonly style="font-family:monospace; font-weight:bold; text-align:center;">
<div style="display:flex; gap:8px; margin-top:8px;">
<button onclick="createRandomPassword()" style="background:#17a2b8;">Generate</button>
<button onclick="useGeneratedPassword()" style="background:#28a745;">Use</button>
<button onclick="closeGenModal()" style="background:#6c757d;">Close</button>
</div>
</div>
</div>

<!-- Category Manager Modal -->
<div id="catModal" class="modal hidden">
<div class="modal-content">
<h3>Manage Categories</h3>
<div id="catListContainer" style="max-height: 180px; overflow-y: auto; margin-bottom: 8px;"></div>
<div style="border-top:1px solid var(--input-border); padding-top:8px;">
<input id="newCatName" placeholder="New Category Name">
<div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
<label style="font-size:13px;">Color:</label>
<input type="color" id="newCatColor" value="#007bff" style="height:30px; padding:0; cursor:pointer;">
</div>
<button onclick="addCategory()" style="background:#28a745;">Add Category</button>
</div>
<button onclick="closeCatModal()" style="background:#6c757d; margin-top:8px;">Close</button>
</div>
</div>

<script>
let db;
let passwords = [];
let notes = [];
let folders = [];
let events = [];
let customAudioData = localStorage.getItem('customChimeData') || '';
let customAudioName = localStorage.getItem('customChimeName') || '';

let categories = [
    {name: 'Personal', color: '#6f42c1'},
    {name: 'Banking', color: '#28a745'},
    {name: 'Shopping', color: '#fd7e14'},
    {name: 'Social', color: '#e83e8c'},
    {name: 'Work', color: '#007bff'},
    {name: 'Utilities', color: '#6c757d'}
];
let masterHash = localStorage.getItem('masterHash') || '';
let editingId = null;
let editingNoteId = null;
let editingFolderId = null;
let editingEventId = null;
let currentNoteImageBase64 = '';
let currentFolderFiles = []; 
let idleTimer;

// Calendar active state
let calCurrentDate = new Date();
let calView = 'month';

// Initialize IndexedDB for Unlimited Storage
const request = indexedDB.open("JamilVaultDB", 1);
request.onerror = function(event) {
    console.error("Database error: " + event.target.errorCode);
    alert("Database error. File attachments might not persist.");
};
request.onupgradeneeded = function(event) {
    db = event.target.result;
    if (!db.objectStoreNames.contains("vaultStore")) {
        db.createObjectStore("vaultStore");
    }
};
request.onsuccess = function(event) {
    db = event.target.result;
    loadAllDataFromDB();
};

function saveDataToDB(key, data, callback) {
    if (!db) return;
    const transaction = db.transaction(["vaultStore"], "readwrite");
    const store = transaction.objectStore("vaultStore");
    const request = store.put(data, key);
    request.onsuccess = function() {
        if (callback) callback();
    };
    request.onerror = function() {
        alert("Error saving data to IndexedDB.");
    };
}

// Define and expose the global unlock function properly
window.unlock = function unlock() {
    const input = document.getElementById('masterPass').value;
    if(!input) {
        showStatus('Enter a password', 'error');
        return;
    }
    if(!masterHash) {
        masterHash = hash(input);
        localStorage.setItem('masterHash', masterHash);
        showStatus('Master password created!');
    }
    if(hash(input) === masterHash) {
        setTimeout(() => {
            document.getElementById('unlock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            populateCategoryDropdowns();
            renderPasswords();
            resetIdleTimer();
        }, 100);
    } else {
        showStatus('Wrong password', 'error');
    }
};

function loadAllDataFromDB() {
    if (!db) return;
    const transaction = db.transaction(["vaultStore"], "readonly");
    const store = transaction.objectStore("vaultStore");
    
    store.get("passwords").onsuccess = function(e) {
        if (e.target.result) passwords = e.target.result;
    };
    store.get("notes").onsuccess = function(e) {
        if (e.target.result) notes = e.target.result;
    };
    store.get("folders").onsuccess = function(e) {
        if (e.target.result) folders = e.target.result;
    };
    store.get("events").onsuccess = function(e) {
        if (e.target.result) events = e.target.result;
    };
    store.get("categories").onsuccess = function(e) {
        if (e.target.result) categories = e.target.result;
    };
}

// Automatically force the default chime on any saved reminder
document.addEventListener('submit', function(e) {
  const chimeInput = document.getElementById('reminder-chime');
  if (chimeInput) {
    chimeInput.value = 'godfather.mp3';
  }
});

// Also catch manual button clicks if your form doesn't use a standard submit event
document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'save-reminder-btn') { // Update 'save-reminder-btn' to match your actual save button ID if needed
    const chimeInput = document.getElementById('reminder-chime');
    if (chimeInput) {
      chimeInput.value = 'godfather.mp3';
    }
  }
});

function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (!document.getElementById('app').classList.contains('hidden')) {
        idleTimer = setTimeout(lock, 300000); 
    }
}

window.onload = () => {
    ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => window.addEventListener(evt, resetIdleTimer));
    initTheme();
    updateCustomChimeUI();
    if (localStorage.getItem('biometricEnabled') === 'true') {
        const bioBtn = document.getElementById('bioBtn');
        if (bioBtn) bioBtn.style.display = 'block';
        const bioToggle = document.getElementById('bioToggle');
        if (bioToggle) bioToggle.checked = true;
    }

    const imgInput = document.getElementById('noteImageInput');
    if (imgInput) {
        imgInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                currentNoteImageBase64 = uploadEvent.target.result;
                document.getElementById('imagePreviewContainer').innerHTML = `<img src="${currentNoteImageBase64}" style="max-height:60px; border-radius:4px;">`;
            };
            reader.readAsDataURL(file);
        });
    }

    const fileInput = document.getElementById('folderFileInput');
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    currentFolderFiles.push({
                        name: file.name,
                        data: uploadEvent.target.result
                    });
                    updateFolderFilePreview();
                };
                reader.readAsDataURL(file);
            }
        });
    }

    setInterval(checkReminders, 30000);
};

function updateFolderFilePreview() {
    const container = document.getElementById('folderFilePreview');
    container.innerHTML = '';
    currentFolderFiles.forEach((f, index) => {
        container.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
            <span>📎 ${f.name}</span>
            <button type="button" onclick="removePendingFile(${index})" style="background:#dc3545; padding:1px 4px; font-size:10px; width:auto; margin:0;">❌</button>
        </div>`;
    });
}

function removePendingFile(index) {
    currentFolderFiles.splice(index, 1);
    updateFolderFilePreview();
}

function initTheme() {

function hash(str) {
    let h = 0;
    for(let i=0; i<str.length; i++) {
        h = ((h<<5)-h) + str.charCodeAt(i);
        h = h & h;
    }
    return Math.abs(h).toString(36);
}

async function toggleBiometricSetting(checkbox) {
    if (checkbox.checked) {
        try {
            if (!window.PublicKeyCredential) {
                alert('WebAuthn is not supported.');
                checkbox.checked = false;
                return;
            }
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            
            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge: challenge,
                    rp: { name: "Password Manager", id: window.location.hostname },
                    user: {
                        id: Uint8Array.from("JamilVault", c => c.charCodeAt(0)),
                        name: "jamil",
                        displayName: "Jamil"
                    },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                    timeout: 60000,
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                    attestation: "none"
                }
            });
            
            if (credential) {
                localStorage.setItem('biometricEnabled', 'true');
                const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
                localStorage.setItem('biometricCredId', credIdB64);
                alert('Biometric login enabled successfully!');
            }
        } catch (err) {
            console.error(err);
            alert('Failed to register biometrics.');
            checkbox.checked = false;
        }
    } else {
        localStorage.removeItem('biometricEnabled');
        localStorage.removeItem('biometricCredId');
        alert('Biometric login disabled.');
    }
}

async function unlockBiometric() {
    try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const credIdB64 = localStorage.getItem('biometricCredId');
        
        let allowedCreds = [];
        if (credIdB64) {
            const binaryString = atob(credIdB64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            allowedCreds = [{ id: bytes.buffer, type: "public-key" }];
        }

        const assertion = await navigator.credentials.get({
            publicKey: {
                challenge: challenge,
                allowCredentials: allowedCreds,
                userVerification: "required"
            }
        });

        if (assertion) {
            document.getElementById('unlock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            populateCategoryDropdowns();
            renderPasswords();
            resetIdleTimer();
        }
    } catch (err) {
        console.error(err);
        alert('Biometric authentication failed.');
    }
}

function checkStrength(pass) {
    const bar = document.getElementById('strengthBar');
    let strength = 0;
    if(pass.length > 7) strength += 25;
    if(/[A-Z]/.test(pass)) strength += 25;
    if(/[0-9]/.test(pass)) strength += 25;
    if(/[^A-Za-z0-9]/.test(pass)) strength += 25;
    
    bar.style.width = strength + '%';
    if(strength <= 25) bar.style.background = '#dc3545';
    else if(strength <= 50) bar.style.background = '#ffc107';
    else if(strength <= 75) bar.style.background = '#17a2b8';
    else bar.style.background = '#28a745';
}

function loadCustomAudio(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        customAudioData = e.target.result;
        customAudioName = file.name;
        localStorage.setItem('customChimeData', customAudioData);
        localStorage.setItem('customChimeName', customAudioName);
        updateCustomChimeUI();
        alert('Custom chime loaded and saved successfully!');
        testCurrentChime();
    };
    reader.readAsDataURL(file);
}

function clearCustomAudio() {
    customAudioData = '';
    customAudioName = '';
    localStorage.removeItem('customChimeData');
    localStorage.removeItem('customChimeName');
    updateCustomChimeUI();
    alert('Reset to default synthetic chime.');
}

function updateCustomChimeUI() {
    const statusEl = document.getElementById('customChimeStatus');
    if (!statusEl) return;
    if (customAudioName) {
        statusEl.textContent = `Using custom file: ${customAudioName}`;
        statusEl.style.color = '#28a745';
        statusEl.style.fontWeight = 'bold';
    } else {
        statusEl.textContent = 'Using default built-in chime';
        statusEl.style.color = '#666';
        statusEl.style.fontWeight = 'normal';
    }
}

function playChimeSound() {
    if (customAudioData) {
        try {
            const audio = new Audio(customAudioData);
            audio.play().catch(e => console.log("Audio play blocked", e));
            return;
        } catch (e) {
            console.log("Error playing custom audio, falling back to synth", e);
        }
    }

    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (frequency, startTime, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = frequency;
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        };

        playTone(523.25, 0, 0.25);   // C5
        playTone(783.99, 0.25, 0.4); // G5
    } catch (e) {
        console.log("AudioContext not supported or blocked", e);
    }
}

function checkReminders() {
    if (document.getElementById('app').classList.contains('hidden')) return; // locked

    const now = new Date();
    events.forEach(ev => {
        if (!ev.reminder || ev.reminder === 'none') return;
        if (!ev.date || !ev.time) return;

        const eventDateTime = new Date(`${ev.date}T${ev.time}:00`);
        const reminderMinutesBefore = parseInt(ev.reminder);
        const alertTime = new Date(eventDateTime.getTime() - (reminderMinutesBefore * 60000));

        const diff = now.getTime() - alertTime.getTime();
        if (diff >= 0 && diff < 35000 && !ev._notified) {
            ev._notified = true;

            playChimeSound();

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`📅 Reminder: ${ev.title}`, {
                    body: `Scheduled for ${ev.date} at ${ev.time}\n${ev.desc || ''}`,
                    icon: 'favicon.ico'
                });
            }
        }
    });
}

function isEventOnDate(ev, dateStr) {
    if (ev.date === dateStr) return true;
    if (!ev.recur || ev.recur === 'none') return false;

    const evDate = new Date(ev.date + 'T00:00:00');
    const targetDate = new Date(dateStr + 'T00:00:00');
    if (targetDate < evDate) return false;

    const diffTime = targetDate - evDate;
    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

    if (ev.recur === 'daily') {
        return diffDays >= 0;
    } else if (ev.recur === 'weekly') {
        return diffDays >= 0 && diffDays % 7 === 0;
    } else if (ev.recur === 'monthly') {
        return targetDate.getDate() === evDate.getDate() && targetDate >= evDate;
    } else if (ev.recur === 'yearly') {
        return targetDate.getMonth() === evDate.getMonth() && targetDate.getDate() === evDate.getDate() && targetDate >= evDate;
    }
    return false;
}

function renderCalendar() {
    const container = document.getElementById('calendarContainer');
    const titleEl = document.getElementById('calTitle');
    container.innerHTML = '';

    const year = calCurrentDate.getFullYear();
    const month = calCurrentDate.getMonth();
    const date = calCurrentDate.getDate();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayColors = ['#e83e8c', '#007bff', '#28a745', '#17a2b8', '#ffc107', '#fd7e14', '#6f42c1'];
    const dayNamesList = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    if (calView === 'month') {
        titleEl.textContent = `${monthNames[month]} ${year}`;
        
        let html = '<div class="cal-grid">';
        dayNamesList.forEach((d, idx) => {
            html += `<div class="cal-header-cell" style="color:${dayColors[idx]};">${d}</div>`;
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevTotalDays = new Date(year, month, 0).getDate();

        for (let i = firstDayIndex; i > 0; i--) {
            const prevDayNum = prevTotalDays - i + 1;
            html += `<div class="cal-cell cal-cell-other"><span style="font-weight:bold;">${prevDayNum}</span></div>`;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        for (let i = 1; i <= totalDays; i++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(i).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;
            const isToday = dateStr === todayStr ? 'today' : '';

            const dayEvents = events.filter(ev => isEventOnDate(ev, dateStr));
            let eventsHtml = '';
            dayEvents.forEach(ev => {
                eventsHtml += `<div class="cal-event-dot" style="background:${ev.color || '#007bff'};" title="${ev.title}">${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
            });

            html += `<div class="cal-cell ${isToday}" onclick="openDayModal('${dateStr}')">
                <span style="font-weight:bold;">${i}</span>
                <div style="overflow:hidden; max-height:38px;">${eventsHtml}</div>
            </div>`;
        }

        const totalCellsSoFar = firstDayIndex + totalDays;
        const remainingCells = totalCellsSoFar % 7 === 0 ? 0 : 7 - (totalCellsSoFar % 7);
        for (let i = 1; i <= remainingCells; i++) {
            html += `<div class="cal-cell cal-cell-other"><span style="font-weight:bold;">${i}</span></div>`;
        }

        html += '</div>';
        container.innerHTML = html;

    } else if (calView === 'week') {
        const startOfWeek = new Date(calCurrentDate);
        startOfWeek.setDate(date - startOfWeek.getDay());
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 6);

        titleEl.textContent = `${startOfWeek.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${endOfWeek.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`;

        let html = '<div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">';
        for (let i = 0; i < 7; i++) {
            const curr = new Date(startOfWeek);
            curr.setDate(curr.getDate() + i);
            const dateStr = curr.toISOString().split('T')[0];
            const dayName = curr.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'});
            const dayEvents = events.filter(ev => isEventOnDate(ev, dateStr));
            const headerColor = dayColors[i];

            html += `<div class="event-item" style="border-left-color: ${headerColor};">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong style="color:${headerColor};">${dayName}</strong>
                    <button class="btn-small" style="background:#28a745; padding:2px 6px; font-size:11px;" onclick="openNewEventForm('${dateStr}')">+ Add Event</button>
                </div>`;
            
            if (dayEvents.length > 0) {
                html += '<div style="margin-top:4px; display:flex; flex-direction:column; gap:4px;">';
                dayEvents.forEach(ev => {

                            <button class="btn-small" style="background:#dc3545; padding:2px 5px; font-size:11px;" onclick="deleteEvent(${ev.id})">🗑️</button>
                        </div>
                    </div>`;
                });
                html += '</div>';
            } else {
                html += '<div style="font-size:12px; color:#666; margin-top:2px;">No events scheduled.</div>';
            }
            html += `</div>`;
        }
        html += '</div>';
        container.innerHTML = html;

    } else if (calView === 'day') {
        const dateStr = calCurrentDate.toISOString().split('T')[0];
        const dayOfWeekIndex = calCurrentDate.getDay();
        const headerColor = dayColors[dayOfWeekIndex];
        
        titleEl.textContent = calCurrentDate.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'});

                <button class="btn-small" style="background:#28a745; padding:4px 10px;" onclick="openNewEventForm('${dateStr}')">+ Add Event</button>
            </div>`;

        if (dayEvents.length > 0) {
            html += '<div style="display:flex; flex-direction:column; gap:6px;">';
            dayEvents.forEach(ev => {
                html += `<div class="event-item" style="border-left-color: ${ev.color || '#007bff'};">

            });
            html += '</div>';
        } else {
            html += '<p style="text-align:center; color:#666; font-size:13px; margin-top:20px;">No events scheduled for this day.</p>';
        }
        html += '</div>';
        container.innerHTML = html;
    }

        async function encryptData(secret, data) {
            const enc = new TextEncoder();
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(secret), {name: "PBKDF2"}, false, ["deriveKey"]
            );
            const key = await window.crypto.subtle.deriveKey(
                {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
                keyMaterial, {name: "AES-GCM", length: 256}, false, ["encrypt"]
            );
            const ciphertext = await window.crypto.subtle.encrypt(
                {name: "AES-GCM", iv: iv}, key, enc.encode(data)
            );
            return JSON.stringify({
                salt: Array.from(salt),
                iv: Array.from(iv),
                ct: Array.from(new Uint8Array(ciphertext))
            });
        }

        async function decryptData(secret, jsonStr) {
            const obj = JSON.parse(jsonStr);
            const enc = new TextEncoder();
            const salt = new Uint8Array(obj.salt);
            const iv = new Uint8Array(obj.iv);
            const ct = new Uint8Array(obj.ct);
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(secret), {name: "PBKDF2"}, false, ["deriveKey"]
            );
            const key = await window.crypto.subtle.deriveKey(
                {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
                keyMaterial, {name: "AES-GCM", length: 256}, false, ["decrypt"]
            );
            const decrypted = await window.crypto.subtle.decrypt(
                {name: "AES-GCM", iv: iv}, key, ct
            );
            return new TextDecoder().decode(decrypted);
        }

                            populateCategoryDropdowns();
                            renderPasswords();
                            renderNotes();
                            renderFolders();
                            renderCalendar();
                            alert('Encrypted backup imported successfully!');
                        } else {
                            alert('Invalid backup content format.');
                        }
                    } catch(err) {
                        alert('Decryption failed. Wrong password or corrupted file.');
                    }
                } else if(file.name.endsWith('.json')) {
                    try {
                        const imported = JSON.parse(content);
                        if(Array.isArray(imported)) {
                            passwords = imported;
                            saveDataToDB("passwords", passwords);
                            renderPasswords();
                            alert('JSON backup imported successfully!');
                        } else if(imported.passwords && Array.isArray(imported.passwords)) {
                            passwords = imported.passwords;
                            saveDataToDB("passwords", passwords);
                            if(imported.notes && Array.isArray(imported.notes)) {
                                notes = imported.notes;
                                saveDataToDB("notes", notes);
                            }
                            if(imported.folders && Array.isArray(imported.folders)) {
                                folders = imported.folders;
                                saveDataToDB("folders", folders);
                            }
                            if(imported.events && Array.isArray(imported.events)) {
                                events = imported.events;
                                saveDataToDB("events", events);
                            }
                            renderPasswords();
                            renderNotes();
                            renderFolders();
                            renderCalendar();
                            alert('JSON backup imported successfully!');
                        } else {
                            alert('Invalid JSON format.');
                        }
                    } catch(err) {
                        alert('Error parsing JSON file.');
                    }
                } else if(file.name.endsWith('.csv')) {
                    try {
                        const lines = content.split('\n');
                        const newPasswords = [];
                        for(let i=1; i<lines.length; i++) {
                            const line = lines[i].trim();
                            if(!line) continue;
                            const row = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                            if(row.length >= 3) {
                                const clean = row.map(val => val.replace(/^"|"$/g, '').trim());
                                newPasswords.push({
                                    site: clean[0],
                                    user: clean[1],
                                    pass: clean[2],
                                    category: clean[3] || 'Personal',
                                    id: Date.now() + i
                                });
                            }
                        }
                        if(newPasswords.length > 0) {
                            passwords = newPasswords;
                            saveDataToDB("passwords", passwords);
                            renderPasswords();
                            alert('CSV backup imported successfully!');
                        } else {
                            alert('No valid records found in CSV file.');
                        }
                    } catch(err) {
                        alert('Error parsing CSV file.');
                    }
                }
            };
            reader.readAsText(file);
        }

            renderPasswords(query);
